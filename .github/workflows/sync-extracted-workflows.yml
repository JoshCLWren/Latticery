name: Sync extracted Factory workflows

on:
  push:
    branches: [extract-working-factory]
    paths:
      - '.github/workflows/sync-extracted-workflows.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PUSH_TOKEN: ${{ secrets.PR_REBASE_TOKEN || secrets.LATTICERY_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: extract-working-factory
          fetch-depth: 0
          token: ${{ env.PUSH_TOKEN }}
      - name: Check out current Factory source
        run: git clone --depth 1 https://github.com/JoshCLWren/comic-pile.git /tmp/comic-pile
      - name: Regenerate the exact reusable workflow surface
        run: |
          set -Eeuo pipefail
          python3 tools/extract_factory.py /tmp/comic-pile --destination "$GITHUB_WORKSPACE"
          python3 tools/repair_factory_wrappers.py --destination "$GITHUB_WORKSPACE"
          python3 tools/complete_factory_test_extraction.py /tmp/comic-pile --destination "$GITHUB_WORKSPACE"
          python3 tools/repair_factory_portability.py --destination "$GITHUB_WORKSPACE"
      - name: Commit generated workflows
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows
          if git diff --cached --quiet; then
            echo 'Workflow surface already synchronized'
            exit 0
          fi
          git commit -m 'Synchronize extracted Factory workflows'
          git push origin HEAD:extract-working-factory
