name: Reconstruct Latticery artwork

on:
  push:
    paths:
      - ".github/workflows/reconstruct-latticery-art.yml"

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat .latticery-upload/part-*.txt | base64 --decode > assets/latticery-work-lattice.webp
          echo "31efb9b518ae186ba102dfbc8b96a70a0fd19336d3bbc27f9326d55463533af6  assets/latticery-work-lattice.webp" | sha256sum -c -
          rm -f assets/latticery-work-lattice.jpg
          rm -rf .latticery-upload

      - name: Commit artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Latticery work lattice artwork"
          git push
