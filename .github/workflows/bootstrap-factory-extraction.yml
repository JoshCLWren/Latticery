name: Bootstrap working Factory extraction

on:
  push:
    branches: [extract-working-factory]
    paths:
      - '.github/workflows/bootstrap-factory-extraction.yml'
      - 'tools/extract_factory.py'
      - 'tools/repair_factory_wrappers.py'
      - 'tools/complete_factory_test_extraction.py'
      - 'tools/repair_factory_portability.py'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Latticery extraction branch
        uses: actions/checkout@v7
        with:
          ref: extract-working-factory
          fetch-depth: 0

      - name: Check out the current working Factory source
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 https://github.com/JoshCLWren/comic-pile.git /tmp/comic-pile
          git -C /tmp/comic-pile rev-parse HEAD

      - name: Copy and parameterize the working Factory
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/extract_factory.py /tmp/comic-pile --destination "$GITHUB_WORKSPACE"
          python3 tools/repair_factory_wrappers.py --destination "$GITHUB_WORKSPACE"
          python3 tools/complete_factory_test_extraction.py /tmp/comic-pile --destination "$GITHUB_WORKSPACE"
          python3 tools/repair_factory_portability.py --destination "$GITHUB_WORKSPACE"
          test -f latticery/__init__.py
          test ! -e src/latticery
          test -f latticery/factory_work_controller.py
          test -f latticery/factory_review_controller.py
          test -f latticery/factory_completion_controller.py
          test -f .github/workflows/fixed-model-factory-dispatch.yml
          test -f .github/scripts/free-model-factory-worker.sh
          test -f .github/factory-expected-workers.json
          test -f tests/fixtures/opencode-catalog/keep-present.json
          test -f docs/AUTONOMOUS_FACTORY_POLICY.md

      - name: Preserve transformed workflows for privileged installation
        uses: actions/upload-artifact@v4
        with:
          name: extracted-factory-workflows
          path: .github/workflows/
          include-hidden-files: true
          if-no-files-found: error

      - name: Commit extracted implementation except workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git reset -- .github/workflows
          if git diff --cached --quiet; then
            echo 'Extraction produced no non-workflow changes'
          else
            git commit -m 'Extract working Factory implementation from ComicPile'
            git push origin HEAD:extract-working-factory
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install package and test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Verify import and build
        shell: bash
        run: |
          set -Eeuo pipefail
          python -c 'import latticery; print(latticery.__file__)'
          python -m build

      - name: Run extracted Factory tests
        shell: bash
        run: |
          set -Eeuo pipefail
          pytest -q
